# ─────────────────────────────────────────────────────────────────────
# 告警大屏 nginx 配置
#
# 部署前需要改的只有两处：
#   - proxy_pass 的 UPSTREAM_HOST:UPSTREAM_PORT（内网接口地址）
#   - root（站点文件放在哪）
#
# 两个硬约束，换环境时要留意：
#
#   1. 站点路径必须是 /alert-screen/。构建产物里的资源引用写死了
#      /alert-screen/assets/...（来自 vite.config.ts 的 base）。
#      要换路径，得改 base 后重新构建，不能只改 nginx。
#
#   2. 接口路径在域名根下，是 /ongoing-alerts-api/...，与前端 base 无关
#      （api.ts 用的是根绝对路径）。所以前端挂在哪一级子路径，都不影响它。
# ─────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    # 站点根目录。dist/ 的内容放在 <root>/alert-screen/ 下，最终形态是
    #   /appdata/aiops_wk/alert-screen/index.html
    #   /appdata/aiops_wk/alert-screen/assets/index-xxxx.js
    # 换目录只需改这一行。
    #
    # 注意 root 指的是「父目录」，不是站点目录本身：URL /alert-screen/x 会被
    # 映射成 <root>/alert-screen/x。
    root /appdata/aiops_wk;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # 带内容哈希的资源可以长缓存：文件名变了才会重新拉
    location ^~ /alert-screen/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html 必须不缓存。否则前端发了新版，用户拿到的还是旧壳，
    # 里面引用的旧资源又已经被删掉，页面直接白屏。
    location = /alert-screen/index.html {
        add_header Cache-Control "no-store" always;
    }

    # SPA 兜底。/alert-screen/、/alert-screen/v2/、/alert-screen/v3/、
    # /alert-screen/v4/ 全都回落到同一个 index.html，再由前端按 pathname
    # 分流到 v1 / v2 / v3 / v4 四个版本。
    # 少了这一段，切到 /v2/、/v3/ 或 /v4/ 会直接 404。
    location /alert-screen/ {
        try_files $uri $uri/ /alert-screen/index.html;
    }

    # ── 观测条件查询接口 ──────────────────────────────────────────────
    #
    # 超时是这段配置的重点。内网单次查询耗时较长，一般不超过 30s：
    #
    #   - proxy_read_timeout 必须显著大于 30s。默认值是 60s，勉强够用；
    #     这里给 90s 留余量。如果只按默认值配，慢请求会被 nginx 先掐成
    #     504，前端把 fetch 超时调到多长都没用。
    #   - 前端那一侧对应的超时是 src/hooks/useAlertPolling.ts 里的
    #     REQUEST_TIMEOUT_MS（当前 60s）。两边要一起放，只改一边不解决问题。
    #
    location = /ongoing-alerts-api/event/queryiongoingevent {
        # 对外只开放这一个 POST，其余方法一律拒绝
        limit_except POST { deny all; }
        client_max_body_size 4k;

        # 内网接口地址。这里不带路径，上游收到的就是原始 URI
        # /ongoing-alerts-api/event/queryiongoingevent。
        # 若上游的路由路径不同，改成 proxy_pass http://HOST:PORT/真实路径;
        proxy_pass http://UPSTREAM_HOST:UPSTREAM_PORT;

        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;

        # 不要把客户端的身份透给上游
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header user_id "";
        proxy_set_header username "";

        # 注意：这里不要加 X-Alert-Data-Source: mock。
        # 那是联调 mock 用的标记，前端见到 mock 就会常驻一个「模拟数据」徽标。
        # 接真实内网接口时加上它，页面会一直谎称数据是模拟的。
        add_header Cache-Control "no-store" always;
    }
}
